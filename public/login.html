<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Sistema de Gestão</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #1a5f7a, #159895);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: white;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 400px;
    }
    .logo {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .logo h1 {
      color: #1a5f7a;
      font-size: 1.6rem;
    }
    .logo p {
      color: #64748b;
      font-size: 0.9rem;
      margin-top: 0.3rem;
    }
    .campo { margin-bottom: 1.2rem; }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.4rem;
      color: #1e293b;
    }
    input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      font-size: 1rem;
    }
    input:focus {
      outline: none;
      border-color: #159895;
      box-shadow: 0 0 0 3px rgba(21,152,149,0.2);
    }
    .botao {
      width: 100%;
      padding: 0.85rem;
      background: #1a5f7a;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 0.5rem;
    }
    .botao:hover { background: #144d63; }
    .mensagem {
      padding: 0.75rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      font-size: 0.9rem;
      display: none;
    }
    .mensagem.erro {
      display: block;
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fca5a5;
    }
    .mensagem.sucesso {
      display: block;
      background: #dcfce7;
      color: #166534;
      border: 1px solid #86efac;
    }
    .info {
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: #64748b;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <h1>Sistema de Gestão</h1>
      <p>Parceiro: PETEE UFMG</p>
    </div>

    <div id="mensagem" class="mensagem"></div>

    <form id="form-login">
      <div class="campo">
        <label for="email">E-mail</label>
        <input type="email" id="email" required placeholder="seu@email.com">
      </div>
      <div class="campo">
        <label for="senha">Senha</label>
        <input type="password" id="senha" required placeholder="••••••••">
      </div>
      <button type="submit" class="botao">Entrar</button>
    </form>

    <div class="info">
      <strong>Admin:</strong> admin@sistema.com / admin123<br>
      <strong>Usuário:</strong> usuario@sistema.com / user123
    </div>
  </div>

  <script>
    const form = document.getElementById('form-login');
    const mensagem = document.getElementById('mensagem');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      mensagem.className = 'mensagem';

      const email = document.getElementById('email').value;
      const senha = document.getElementById('senha').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ email, senha })
        });

        const dados = await res.json();

        if (!res.ok) {
          throw new Error(dados.erro || 'Falha no login');
        }

        mensagem.textContent = 'Login realizado! Redirecionando...';
        mensagem.className = 'mensagem sucesso';

        setTimeout(() => {
          window.location.href = '/';
        }, 800);

      } catch (erro) {
        mensagem.textContent = erro.message;
        mensagem.className = 'mensagem erro';
      }
    });
  </script>
</body>
</html>
